
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        /* Add your CSS styling here if needed */
         body {
            margin: 0; /* Remove default margin */
            padding: 0; /* Remove default padding */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34; /* Background color for the body */
        }
         
        .calculator {
            width: 350px;
            height: 500px;
            margin: 100px auto;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            border-radius:10px;
            background-color: black;
        }
        input[type="text"] {
            width: 90%;
            height: 200px;
            padding: 5px;
            padding-bottom: 15px;
            font-size: 40px;
            margin-bottom: 17px;
            margin-top: 17px;
            margin-left: -5px;
            background-color: orange;
        }
        input[type="button"] {
            width: 70px;
            height: 50px;
            font-size: 18px;
            margin: 5px;
            border: 1px solid #09d947;
            background-color: #72f00c;
            color:black;
            transition: background-color 0.3s ease;
        }
        input[type="button"]:active{
            background-color: #09d924;
            color: black;
            font-size: 20px;
             
        }
        
        #add{ 
            background-color:#ff4e26;
            border:1px solid #f50a0a;
        }
        #add:active{ 
            background-color:#f50a0a;
            border:1px solid #f50a0a ;
            font-size: 20px;
        }
    
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <br>
        <input type="button" value="1" onclick="appendToDisplay('1')">
        <input type="button" value="2" onclick="appendToDisplay('2')">
        <input type="button" value="3" onclick="appendToDisplay('3')">
        <input type="button" value="+" onclick="appendToDisplay('+')" id="add" >
        <br>
        <input type="button" value="4" onclick="appendToDisplay('4')">
        <input type="button" value="5" onclick="appendToDisplay('5')">
        <input type="button" value="6" onclick="appendToDisplay('6')">
        <input type="button" value="-" onclick="appendToDisplay('-')" id="add" >
        <br>
        <input type="button" value="7" onclick="appendToDisplay('7')">
        <input type="button" value="8" onclick="appendToDisplay('8')">
        <input type="button" value="9" onclick="appendToDisplay('9')">
        <input type="button" value="*" onclick="appendToDisplay('*')" id="add" >
        <br>
        <input type="button" value="C" onclick="clearDisplay()" id="add" >
        <input type="button" value="0" onclick="appendToDisplay('0')">
        <input type="button" value="=" onclick="calculate()" id="add" >
        <input type="button" value="/" onclick="appendToDisplay('/')" id="add" >
    </div>
    
    <script>
        function appendToDisplay(value) {
            document.getElementById("display").value += value;
        }
        
        function clearDisplay() {
            document.getElementById("display").value = "";
        }
        
        function calculate() {
            try {
                document.getElementById("display").value = eval(document.getElementById("display").value);
            } catch (error) {
                document.getElementById("display").value = alert("invalid expression"); ;
            }
        }
    </script>
</body>
</html>
